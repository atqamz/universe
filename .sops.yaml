# Universe holds only pavg15 system secrets. The GPG primary key remains an
# interactive edit/recovery recipient; pavg15's persistent SSH host key is
# converted with ssh-to-age so sops-nix can decrypt headlessly at activation.
# Existing ciphertext can retain retired recipients until explicitly rekeyed.
creation_rules:
  - path_regex: modules/nixos/secrets/.*\.sops\.yaml$
    pgp: F1F60517602888C8D5E486EB8AD7D4A302EE6771
    age: age1g09k8jvs32stsnkvv73r0ghz0qc887ck0lhr3ss9578n4dtdh5ds7leqn4
