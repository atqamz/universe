name: Auto-merge dependabot PRs

on:
  workflow_run:
    workflows: ["Build and check"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: merge the pr for this branch
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD" \
            --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            echo "no open pr for $HEAD"
            exit 0
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --merge --delete-branch "$number"
        env:
          HEAD: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
