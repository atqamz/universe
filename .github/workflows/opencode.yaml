name: OpenCode integration

on:
  pull_request:
    paths:
      - "configs/dotagents/**"
      - ".github/workflows/opencode.yaml"
  push:
    branches:
      - main
    paths:
      - "configs/dotagents/**"
      - ".github/workflows/opencode.yaml"

permissions:
  contents: read

jobs:
  dynamic-models:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: configs/dotagents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: OPENCODE_RUNNER='["bunx", "--bun", "opencode-ai@1.18.16"]' bun test
      - run: jq -e . opencode/opencode.json
