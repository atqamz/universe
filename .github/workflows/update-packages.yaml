name: Update packages

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: list packages
        id: list
        run: |
          names=$(nix eval --json '.#packages.x86_64-linux' --apply builtins.attrNames)
          echo "packages=$names" >> "$GITHUB_OUTPUT"

  update:
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.list.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: atqamz-universe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: update package
        id: update
        env:
          NIX_PATH: nixpkgs=flake:nixpkgs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          update_args=()
          if [ "$PACKAGE" = "unity-cli" ]; then
            update_args+=(--use-update-script)
          fi
          nix shell nixpkgs#nix-update -c nix-update \
            --flake --commit "${update_args[@]}" \
            --override-filename "pkgs/$PACKAGE/default.nix" \
            "$PACKAGE"
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: rebase onto current main
        if: steps.update.outputs.changed == 'true'
        run: git pull --rebase origin main
      - name: flake check
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --print-build-logs
      - name: push checked commit to main
        if: steps.update.outputs.changed == 'true'
        run: git push origin HEAD:main
